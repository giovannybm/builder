services:
  revyme-builder:
    image: revyme-builder:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SANDBOX_URL: ${VITE_SANDBOX_URL:-https://builder-canvas.giobadillo.dev}
        VITE_PREVIEW_HOST: ${VITE_PREVIEW_HOST:-https://builder-preview.giobadillo.dev}
    restart: unless-stopped
    init: true
    ports:
      # Keep origins reachable only by the VPS-local Cloudflare Tunnel client.
      - 127.0.0.1:3333:3333
      - 127.0.0.1:5174:5174
      - 127.0.0.1:5175:5175
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3333/ && wget -q --spider http://127.0.0.1:5174/ && wget -q --spider http://127.0.0.1:5175/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
